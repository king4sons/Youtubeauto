<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>RECKONING — Status</title>
<style>
  :root {
    --ink: #0a0a0a;
    --ink-soft: #141414;
    --ember: #c9522f;
    --ember-dim: #6b3520;
    --bone: #e8e2d4;
    --bone-dim: #8a8478;
    --signal-green: #5a8f6e;
    --signal-amber: #c9962f;
    --hairline: #2a2622;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--ink);
    color: var(--bone);
    font-family: 'Courier New', ui-monospace, SFMono-Regular, Menlo, monospace;
    min-height: 100vh;
  }

  .scanline {
    position: fixed;
    inset: 0;
    pointer-events: none;
    background: repeating-linear-gradient(
      to bottom,
      rgba(255,255,255,0.012) 0px,
      rgba(255,255,255,0.012) 1px,
      transparent 1px,
      transparent 3px
    );
    z-index: 100;
  }

  header {
    border-bottom: 1px solid var(--hairline);
    padding: 28px 40px 22px;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
  }

  .wordmark {
    font-family: Georgia, 'Times New Roman', serif;
    font-size: 28px;
    letter-spacing: 0.12em;
    color: var(--bone);
  }
  .wordmark span { color: var(--ember); }

  .subtitle {
    font-size: 11px;
    letter-spacing: 0.15em;
    color: var(--bone-dim);
    text-transform: uppercase;
    margin-top: 4px;
  }

  .clock {
    font-size: 12px;
    color: var(--bone-dim);
    letter-spacing: 0.08em;
  }

  main {
    padding: 40px;
    max-width: 1100px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: 1.1fr 1fr;
    gap: 24px;
  }

  @media (max-width: 820px) {
    main { grid-template-columns: 1fr; padding: 24px; }
    header { padding: 20px; flex-direction: column; gap: 10px; align-items: flex-start; }
  }

  .panel {
    border: 1px solid var(--hairline);
    background: var(--ink-soft);
    padding: 22px 24px;
  }

  .panel-label {
    font-size: 10px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--bone-dim);
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .mic-row {
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .pulse {
    width: 11px;
    height: 11px;
    border-radius: 50%;
    background: var(--bone-dim);
    flex-shrink: 0;
  }
  .pulse.idle { background: var(--bone-dim); }
  .pulse.listening { background: var(--signal-amber); box-shadow: 0 0 0 0 rgba(201,150,47,0.6); animation: pulse-ring 1.4s infinite; }
  .pulse.thinking { background: var(--ember); box-shadow: 0 0 0 0 rgba(201,82,47,0.6); animation: pulse-ring 0.9s infinite; }
  .pulse.speaking { background: var(--signal-green); box-shadow: 0 0 0 0 rgba(90,143,110,0.6); animation: pulse-ring 1.1s infinite; }
  .pulse.offline, .pulse.unknown { background: #3a352e; }

  @keyframes pulse-ring {
    0% { box-shadow: 0 0 0 0 currentColor; }
    70% { box-shadow: 0 0 0 8px rgba(0,0,0,0); }
    100% { box-shadow: 0 0 0 0 rgba(0,0,0,0); }
  }

  .mic-state {
    font-size: 22px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
  }

  .mic-state.idle { color: var(--bone-dim); }
  .mic-state.listening { color: var(--signal-amber); }
  .mic-state.thinking { color: var(--ember); }
  .mic-state.speaking { color: var(--signal-green); }

  .pipeline-stage {
    font-size: 18px;
    color: var(--bone);
    margin-bottom: 8px;
  }
  .pipeline-project {
    font-size: 13px;
    color: var(--ember);
    letter-spacing: 0.04em;
    margin-bottom: 14px;
  }
  .pipeline-next {
    font-size: 13px;
    color: var(--bone-dim);
    border-top: 1px solid var(--hairline);
    padding-top: 12px;
  }
  .pipeline-next strong { color: var(--bone); font-weight: normal; }

  .empty-state {
    color: var(--bone-dim);
    font-size: 13px;
    font-style: italic;
  }

  .memory-list {
    display: flex;
    flex-direction: column;
    gap: 12px;
    max-height: 280px;
    overflow-y: auto;
  }
  .memory-item {
    border-left: 2px solid var(--ember-dim);
    padding-left: 12px;
    font-size: 13px;
    line-height: 1.5;
  }
  .memory-tag {
    color: var(--ember);
    font-size: 10px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-bottom: 3px;
  }
  .memory-date {
    color: var(--bone-dim);
    font-size: 10px;
    margin-left: 6px;
  }

  .status-text {
    font-size: 14px;
    line-height: 1.6;
    color: var(--bone);
  }

  .app-log-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .app-log-item {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    color: var(--bone-dim);
    border-bottom: 1px solid var(--hairline);
    padding-bottom: 6px;
  }
  .app-log-item span:first-child { color: var(--bone); }

  .turn-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
    max-height: 280px;
    overflow-y: auto;
  }
  .turn-item {
    border-left: 2px solid var(--hairline);
    padding-left: 12px;
    font-size: 13px;
    line-height: 1.5;
  }
  .turn-item.role-user { border-left-color: var(--ember-dim); }
  .turn-item.role-assistant { border-left-color: var(--signal-green); }
  .turn-meta {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 3px;
  }
  .turn-role {
    font-size: 10px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--bone-dim);
  }
  .channel-tag {
    font-size: 9px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    padding: 1px 6px;
    border-radius: 2px;
    border: 1px solid var(--hairline);
  }
  .channel-tag.voice { color: var(--ember); border-color: var(--ember-dim); }
  .channel-tag.telegram { color: var(--signal-green); border-color: #2e4a37; }

  .full-width { grid-column: 1 / -1; }

  .conn-error {
    color: var(--ember);
    font-size: 13px;
    line-height: 1.6;
  }

  footer {
    text-align: center;
    padding: 30px;
    font-size: 10px;
    color: var(--bone-dim);
    letter-spacing: 0.1em;
  }
</style>
</head>
<body>
<div class="scanline"></div>

<header>
  <div>
    <div class="wordmark">RECKONING<span>.</span></div>
    <div class="subtitle">Operational status — read only</div>
  </div>
  <div class="clock" id="clock"></div>
</header>

<main id="app">
  <div class="panel full-width">
    <div class="conn-error" id="loading">Connecting to local status feed…</div>
  </div>
</main>

<footer>NO ACTIONS CAN BE TRIGGERED FROM THIS SCREEN — VIEW ONLY</footer>

<script>
  const API = "http://localhost:5151/api/status";

  function tickClock() {
    const el = document.getElementById('clock');
    const now = new Date();
    el.textContent = now.toLocaleString('en-US', {
      weekday: 'short', month: 'short', day: 'numeric',
      hour: '2-digit', minute: '2-digit', second: '2-digit'
    });
  }
  setInterval(tickClock, 1000);
  tickClock();

  function escapeHtml(s) {
    const div = document.createElement('div');
    div.textContent = s ?? '';
    return div.innerHTML;
  }

  function renderMicStatus(state) {
    const s = (state || 'unknown').toLowerCase();
    return `
      <div class="panel-label">Mic Status</div>
      <div class="mic-row">
        <div class="pulse ${s}"></div>
        <div class="mic-state ${s}">${escapeHtml(s)}</div>
      </div>
    `;
  }

  function renderPipeline(pipeline) {
    if (!pipeline) {
      return `<div class="panel-label">Current Task / Pipeline</div><div class="empty-state">No active pipeline stage recorded yet.</div>`;
    }
    return `
      <div class="panel-label">Current Task / Pipeline</div>
      <div class="pipeline-project">${escapeHtml(pipeline.project)}</div>
      <div class="pipeline-stage">${escapeHtml(pipeline.stage)}</div>
      ${pipeline.next_step ? `<div class="pipeline-next">Next: <strong>${escapeHtml(pipeline.next_step)}</strong></div>` : ''}
    `;
  }

  function renderDailyStatus(text) {
    return `
      <div class="panel-label">System Status</div>
      <div class="status-text">${escapeHtml(text || 'No status given yet.')}</div>
    `;
  }

  function renderMemories(memories) {
    if (!memories || memories.length === 0) {
      return `<div class="panel-label">Memory Access — Recent Entries</div><div class="empty-state">No structured memories stored yet.</div>`;
    }
    const items = memories.map(m => `
      <div class="memory-item">
        <div class="memory-tag">${escapeHtml(m.project)} / ${escapeHtml(m.category)}<span class="memory-date">${escapeHtml(m.date)}</span></div>
        <div>${escapeHtml(m.content)}</div>
      </div>
    `).join('');
    return `<div class="panel-label">Memory Access — Recent Entries</div><div class="memory-list">${items}</div>`;
  }

  function renderAppLog(launches) {
    if (!launches || launches.length === 0) {
      return `<div class="panel-label">App Launch Log</div><div class="empty-state">No apps opened yet.</div>`;
    }
    const items = launches.map(l => `
      <div class="app-log-item">
        <span>${escapeHtml(l.app)}</span>
        <span>${escapeHtml(l.launched_at)}</span>
      </div>
    `).join('');
    return `<div class="panel-label">App Launch Log</div><div class="app-log-list">${items}</div>`;
  }

  function renderTurns(turns) {
    if (!turns || turns.length === 0) {
      return `<div class="panel-label">Recent Conversation</div><div class="empty-state">No conversation yet.</div>`;
    }
    const channels = ['voice', 'telegram'];
    const items = turns.map(t => {
      const channel = channels.includes(t.channel) ? t.channel : 'voice';
      const role = t.role === 'assistant' ? 'assistant' : 'user';
      return `
        <div class="turn-item role-${role}">
          <div class="turn-meta">
            <span class="turn-role">${escapeHtml(role)}</span>
            <span class="channel-tag ${channel}">${escapeHtml(channel)}</span>
          </div>
          <div>${escapeHtml(t.content)}</div>
        </div>
      `;
    }).join('');
    return `<div class="panel-label">Recent Conversation</div><div class="turn-list">${items}</div>`;
  }

  async function refresh() {
    const app = document.getElementById('app');
    try {
      const res = await fetch(API);
      if (!res.ok) throw new Error('bad response');
      const data = await res.json();

      app.innerHTML = `
        <div class="panel">${renderMicStatus(data.mic_status)}</div>
        <div class="panel">${renderPipeline(data.pipeline)}</div>
        <div class="panel">${renderDailyStatus(data.daily_status)}</div>
        <div class="panel">${renderAppLog(data.app_launches)}</div>
        <div class="panel full-width">${renderTurns(data.recent_turns)}</div>
        <div class="panel full-width">${renderMemories(data.recent_memories)}</div>
      `;
    } catch (e) {
      app.innerHTML = `
        <div class="panel full-width">
          <div class="conn-error">
            Can't reach the status feed at localhost:5151.<br/>
            Run <strong>python3 dashboard_server.py</strong> in the jarvis folder, then reload this page.
          </div>
        </div>
      `;
    }
  }

  refresh();
  setInterval(refresh, 4000);
</script>

</body>
</html>
